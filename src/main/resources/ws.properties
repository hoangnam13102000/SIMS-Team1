## Cau hinh WebSocket dung cho thong bao don hang moi real-time.
##
## Kien truc: mo AdminMainFrame se tu khoi dong 1 WebSocket SERVER lang nghe
## tren WS_PORT (tren chinh may dang chay app quan tri). Cac may khac (vd:
## may ban hang / CheckoutDialog) dong vai tro CLIENT, ket noi toi WS_HOST:WS_PORT
## va gui 1 message ngan moi khi tao don hang thanh cong.
##
## Neu app quan tri va app ban hang chay tren CUNG 1 may (vd: test/demo local),
## de nguyen WS_HOST=localhost. Neu chay tren nhieu may khac nhau trong cung
## mang LAN, doi WS_HOST thanh dia chi IP LAN cua may dang chay AdminMainFrame
## (vd: 192.168.1.10). Server can duoc may client ping toi duoc; khong dung
## qua tuong lua/mang khac nhau.
WS_HOST=localhost
WS_PORT=8887

## Port rieng cho WebSocket chat ho tro khach hang (persistent, 2 chieu).
## Khac WS_PORT o tren (chi dung cho thong bao don hang moi, 1 chieu, fire-and-forget).
## Cung quy tac WS_HOST: neu chay nhieu may trong LAN, doi thanh IP LAN cua may AdminMainFrame.
WS_CHAT_PORT=8890

## ===== CHAT QUA INTERNET (khong cung LAN, vd: client o xa, sau NAT/CGNAT) =====
## Neu may AdminMainFrame khong co IP public (VPS chi cap quyen DB, khong SSH,
## hoac mang nha bi CGNAT khong port-forward duoc) thi dung ngrok de expose
## port 8890 ra Internet tam thoi:
##
##   1. Cai ngrok: https://ngrok.com/download, dang ky tai khoan free, lay
##      authtoken o dashboard.ngrok.com -> "Your Authtoken", roi chay 1 lan:
##        ngrok config add-authtoken <TOKEN_CUA_BAN>
##   2. Mo AdminMainFrame TRUOC (de ChatServer bind port 8890 tren localhost).
##   3. Mo 1 cua so CMD/PowerShell KHAC, chay va GIU NGUYEN cua so nay:
##        ngrok http 8890
##      (Luu y: dung "ngrok tcp 8890" vi tu 2026 ngrok yeu cau xac minh the
##      cho tunnel TCP tren tai khoan free; "ngrok http" van mien phi va
##      WebSocket van chay binh thuong qua no bang giao thuc wss://).
##   4. Ngrok se in ra dong "Forwarding": vd
##        https://manned-defense-subtext.ngrok-free.dev -> http://localhost:8890
##      Copy dung phan domain (https://...ngrok-free.dev).
##   5. CHI sua tren may CLIENT (may admin giu nguyen WS_HOST=localhost o tren,
##      KHONG dong WS_CHAT_URL): dien vao WS_CHAT_URL ben duoi, doi https:// ->
##      wss://. ChatClient se uu tien dung WS_CHAT_URL neu no khong rong, con
##      rong/comment thi tu dong fallback ve WS_HOST:WS_CHAT_PORT nhu binh thuong.
##
## QUAN TRONG: cua so "ngrok http 8890" phai duoc GIU CHAY SUOT trong luc dung
## chat - dong cua so / tat may admin la mat ket noi ngay. Moi lan chay lai
## ngrok (tren tai khoan free) se ra 1 domain MOI, phai cap nhat lai dong
## WS_CHAT_URL nay tren TAT CA may client. Neu can domain co dinh (khong doi
## moi lan restart) hoac dung lau dai/production, nen nang cap goi ngrok tra
## phi hoac chuyen sang thue VPS rieng de chay ChatServer thay vi dung tunnel.
#WS_CHAT_URL=wss://manned-defense-subtext.ngrok-free.dev

## Port rieng cho hang doi dat hang FIFO tap trung (OrderQueueServer/Client).
## PHAI KHAC WS_CHAT_PORT o tren - neu de trung port, ChatServer va OrderQueueServer
## se cung tranh bind 1 port trong AdminMainFrame va 1 trong 2 se bind loi.
WS_ORDER_PORT=8889

## Chu ky (ms) DbChangeWatcher doc lai DB de phat hien du lieu bi thay doi
## TU BEN NGOAI app (vd: xoa/sua truc tiep bang SSMS hoac script SQL) - nhung
## thay doi nay khong di qua code Java nen khong the tu broadcast nhu binh
## thuong. DbChangeWatcher chi doc CHECKSUM_AGG/COUNT cua tung bang (re, khong
## can bat Change Tracking) roi so sanh voi lan doc truoc; neu khac, broadcast
## DATA_CHANGED de moi man hinh dang mo tu tai lai. Giam so nay de phat hien
## nhanh hon (tot cho demo), tang len de giam tai DB khi du lieu lon.
DB_POLL_INTERVAL_MS=4000

