## Cau hinh WebSocket dung cho thong bao don hang moi real-time.
##
## Kien truc: mo AdminMainFrame se tu khoi dong 1 WebSocket SERVER lang nghe
## tren WS_PORT (tren chinh may dang chay app quan tri). Cac may khac (vd:
## may ban hang / CheckoutDialog) dong vai tro CLIENT, ket noi toi WS_HOST:WS_PORT
## va gui 1 message ngan moi khi tao don hang thanh cong.
##
## Neu app quan tri va app ban hang chay tren CUNG 1 may (vd: test/demo local),
## de nguyen WS_HOST=localhost. Neu chay tren nhieu may khac nhau trong cung
## mang LAN, doi WS_HOST thanh dia chi IP LAN cua may dang chay AdminMainFrame
## (vd: 192.168.1.10). Server can duoc may client ping toi duoc; khong dung
## qua tuong lua/mang khac nhau.
WS_HOST=localhost
WS_PORT=8887

## Port rieng cho WebSocket chat ho tro khach hang (persistent, 2 chieu).
## Khac WS_PORT o tren (chi dung cho thong bao don hang moi, 1 chieu, fire-and-forget).
## Cung quy tac WS_HOST: neu chay nhieu may trong LAN, doi thanh IP LAN cua may AdminMainFrame.
WS_CHAT_PORT=8890

## Port rieng cho hang doi dat hang FIFO tap trung (OrderQueueServer/Client).
## PHAI KHAC WS_CHAT_PORT o tren - neu de trung port, ChatServer va OrderQueueServer
## se cung tranh bind 1 port trong AdminMainFrame va 1 trong 2 se bind loi.
WS_ORDER_PORT=8889

## Chu ky (ms) DbChangeWatcher doc lai DB de phat hien du lieu bi thay doi
## TU BEN NGOAI app (vd: xoa/sua truc tiep bang phpMyAdmin hoac script SQL) - nhung
## thay doi nay khong di qua code Java nen khong the tu broadcast nhu binh
## thuong. DbChangeWatcher chi doc CHECKSUM_AGG/COUNT cua tung bang (re, khong
## can bat Change Tracking) roi so sanh voi lan doc truoc; neu khac, broadcast
## DATA_CHANGED de moi man hinh dang mo tu tai lai. Giam so nay de phat hien
## nhanh hon (tot cho demo), tang len de giam tai DB khi du lieu lon.
DB_POLL_INTERVAL_MS=4000

